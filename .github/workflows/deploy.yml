name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One-time setup (needs repository admin, the workflow token cannot do it):
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
# enablement: true below is best-effort only; it works when the token is allowed
# to create the site, and is harmless once the site exists.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project site is served under /<repository>/ (here /fatigue-meter/);
      # vite.config.ts reads BASE_PATH for the asset base, manifest scope and start_url.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
